<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日记工作台</title>
<link rel="icon" href="/media/favicon/favicon-32.png">
<style>
:root {
	--bg: #0d0e17;
	--card: #161827;
	--card-2: #1d2033;
	--line: #2a2e48;
	--text: #e8eaf6;
	--muted: #9095b5;
	--primary: #8b7cff;
	--primary-2: #b9b0ff;
	--glow: rgba(139, 124, 255, 0.45);
	--danger: #ff6b8a;
	--ok: #5ee0b0;
	--radius: 16px;
}
* { box-sizing: border-box; }
body {
	margin: 0;
	min-height: 100vh;
	background:
		radial-gradient(1200px 500px at 85% -10%, rgba(139, 124, 255, 0.16), transparent 60%),
		radial-gradient(900px 400px at -10% 110%, rgba(90, 120, 255, 0.12), transparent 60%),
		var(--bg);
	color: var(--text);
	font: 15px/1.65 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--primary-2); }

header {
	position: sticky; top: 0; z-index: 10;
	display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
	padding: 14px 24px;
	background: rgba(13, 14, 23, 0.82);
	backdrop-filter: blur(10px);
	border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; margin-right: auto; }
.brand img { width: 34px; height: 34px; border-radius: 10px; }
.brand .bolt { color: var(--primary); filter: drop-shadow(0 0 6px var(--glow)); }
.pill {
	padding: 4px 12px; border-radius: 999px; font-size: 13px;
	background: var(--card-2); border: 1px solid var(--line); color: var(--muted);
}
.pill.dirty { color: #ffd479; border-color: #6b5a2a; }
.pill.clean { color: var(--ok); border-color: #2a5a4a; }

.btn {
	border: 1px solid var(--line); background: var(--card-2);
	padding: 8px 16px; border-radius: 12px; cursor: pointer;
	transition: border-color .2s, box-shadow .2s, transform .1s;
}
.btn:hover { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139,124,255,.15); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary {
	background: linear-gradient(135deg, #7b6bff, #5b7cff);
	border-color: transparent; color: #fff; font-weight: 600;
	box-shadow: 0 4px 18px -6px var(--glow);
}
.btn.danger:hover { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,107,138,.15); }
.btn.small { padding: 4px 10px; font-size: 13px; border-radius: 9px; }

main {
	max-width: 1180px; margin: 0 auto; padding: 24px;
	display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 24px; align-items: start;
}
@media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 12px 16px; } }

.card {
	background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
	padding: 20px;
}
.compose { position: sticky; top: 84px; }
@media (max-width: 900px) { .compose { position: static; } }
.card h2 { margin: 0 0 14px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.card h2::before {
	content: ""; width: 10px; height: 16px; background: var(--primary);
	clip-path: polygon(62% 0, 8% 58%, 44% 58%, 30% 100%, 92% 38%, 55% 38%);
	filter: drop-shadow(0 0 3px var(--glow));
}
.editing-banner {
	display: none; align-items: center; justify-content: space-between;
	margin: -4px 0 12px; padding: 8px 12px; border-radius: 10px;
	background: rgba(139,124,255,.12); color: var(--primary-2); font-size: 13px;
}
.editing .editing-banner { display: flex; }

textarea {
	width: 100%; min-height: 170px; resize: vertical;
	background: var(--card-2); border: 1px solid var(--line); border-radius: 12px;
	padding: 12px 14px; outline: none; line-height: 1.7;
}
textarea:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139,124,255,.15); }
.counter { text-align: right; color: var(--muted); font-size: 12px; margin-top: 4px; }

.drop {
	margin-top: 10px; padding: 14px; border: 1.5px dashed var(--line); border-radius: 12px;
	color: var(--muted); text-align: center; cursor: pointer; font-size: 14px;
	transition: border-color .2s, background .2s;
}
.drop.over, .drop:hover { border-color: var(--primary); background: rgba(139,124,255,.06); color: var(--text); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-top: 10px; }
.thumbs:empty { display: none; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--card-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button {
	position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
	border: 0; background: rgba(0,0,0,.65); color: #fff; cursor: pointer; line-height: 22px; padding: 0;
}

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.fields .full { grid-column: 1 / -1; }
@media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
input[type=text], input[type=datetime-local] {
	width: 100%; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px;
	padding: 8px 12px; outline: none; color-scheme: dark;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip {
	padding: 3px 10px; border-radius: 999px; font-size: 13px; cursor: pointer;
	background: var(--card-2); border: 1px solid var(--line);
}
.chip.on { border-color: var(--primary); color: var(--primary-2); background: rgba(139,124,255,.12); }
.actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; align-items: center; }
.actions .hint { margin-right: auto; color: var(--muted); font-size: 12px; }

.list { display: flex; flex-direction: column; gap: 14px; }
.entry { transition: border-color .2s, box-shadow .2s; }
.entry:hover { border-color: rgba(139,124,255,.5); box-shadow: 0 6px 24px -10px var(--glow); }
.entry .meta { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.entry .content { white-space: pre-wrap; word-break: break-word; margin: 0 0 10px; }
.entry .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; margin-bottom: 10px; }
.entry .imgs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }
.entry .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.entry .tags span { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--card-2); color: var(--primary-2); }
.entry .ops { display: flex; gap: 8px; justify-content: flex-end; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

.toast {
	position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
	background: var(--card-2); border: 1px solid var(--line); border-radius: 12px;
	padding: 10px 18px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 50;
	max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%); }
.toast.err { border-color: var(--danger); color: #ffc2cf; }

dialog {
	background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius);
	width: min(640px, calc(100vw - 32px)); padding: 20px;
}
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog pre {
	background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
	max-height: 300px; overflow: auto; white-space: pre-wrap; font-size: 12.5px;
}
.spinner {
	display: inline-block; width: 14px; height: 14px; border-radius: 50%;
	border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .8s linear infinite;
	vertical-align: -2px; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
	<div class="brand">
		<img src="/media/assets/home/home.webp" alt="">
		<span>czspig 的日记工作台 <span class="bolt">⚡</span></span>
	</div>
	<span id="status" class="pill">读取中…</span>
	<a class="btn" href="__SITE_URL__" target="_blank" rel="noopener">看看网站</a>
	<button id="publish" class="btn primary">发布到网站</button>
</header>

<main>
	<section class="card compose" id="compose">
		<h2 id="compose-title">写日记</h2>
		<div class="editing-banner">正在修改一条旧日记 <button class="btn small" id="cancel-edit">取消修改</button></div>
		<textarea id="content" placeholder="今天发生了什么？（Ctrl + Enter 保存）"></textarea>
		<div class="counter"><span id="count">0</span> 字</div>

		<div class="drop" id="drop">📷 点击选择图片，或把图片拖到这里 / 直接 Ctrl + V 粘贴</div>
		<input type="file" id="file" accept="image/*" multiple hidden>
		<div class="thumbs" id="thumbs"></div>

		<div class="fields">
			<div class="full">
				<label>心情</label>
				<div class="chips" id="moods"></div>
				<input type="text" id="mood" placeholder="也可以自己写">
			</div>
			<div>
				<label>地点</label>
				<input type="text" id="location" placeholder="可选">
			</div>
			<div>
				<label>时间</label>
				<input type="datetime-local" id="date">
			</div>
			<div class="full">
				<label>标签（用逗号或空格分隔）</label>
				<input type="text" id="tags" placeholder="例如：生活 番剧">
				<div class="chips" id="tag-suggest" style="margin-top:8px"></div>
			</div>
		</div>

		<div class="actions">
			<span class="hint">保存后在右侧可以看到，点「发布到网站」才会公开</span>
			<button class="btn" id="clear">清空</button>
			<button class="btn primary" id="save">保存</button>
		</div>
	</section>

	<section>
		<div class="list" id="list"></div>
	</section>
</main>

<dialog id="publish-dialog">
	<h3 style="margin-top:0" id="publish-title">发布中…</h3>
	<pre id="publish-log"></pre>
	<p id="publish-tip" style="color:var(--muted);font-size:13px"></p>
	<div style="text-align:right"><button class="btn" id="close-dialog">关闭</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
const MOODS = ["开心", "平静", "兴奋", "感动", "累了", "emo", "摸鱼", "充实"];
const DRAFT_KEY = "workbench-draft";
const $ = (id) => document.getElementById(id);

const state = {
	entries: [],
	editingId: null,
	keptImages: [],   // 已有图片的路径（编辑时）
	newImages: [],    // { dataUrl }
	busy: false,
};

// ---------- 工具 ----------
async function api(method, url, body) {
	const res = await fetch(url, {
		method,
		headers: { "Content-Type": "application/json", "X-Token": TOKEN },
		body: body ? JSON.stringify(body) : undefined,
	});
	const data = await res.json().catch(() => ({}));
	if (!res.ok) throw new Error(data.error || `请求失败（${res.status}）`);
	return data;
}

let toastTimer;
function toast(msg, isErr = false) {
	const t = $("toast");
	t.textContent = msg;
	t.className = "toast show" + (isErr ? " err" : "");
	clearTimeout(toastTimer);
	toastTimer = setTimeout(() => (t.className = "toast"), isErr ? 5000 : 2500);
}

const pad = (n) => String(n).padStart(2, "0");
function toLocalInput(d) {
	return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toIsoWithOffset(localValue) {
	const d = localValue ? new Date(localValue) : new Date();
	const off = -d.getTimezoneOffset();
	const sign = off >= 0 ? "+" : "-";
	return `${toLocalInput(d)}:00${sign}${pad(Math.floor(Math.abs(off) / 60))}:${pad(Math.abs(off) % 60)}`;
}
function fmtDate(iso) {
	const d = new Date(iso);
	return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const mediaUrl = (p) => "/media" + p;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const parseTags = (s) => s.split(/[,，\s]+/).map((t) => t.trim()).filter(Boolean);

// ---------- 状态栏 ----------
function renderStatus(st) {
	const el = $("status");
	const pending = st.changes + st.unpushed;
	if (pending > 0) {
		el.className = "pill dirty";
		el.textContent = st.changes > 0 ? `${st.changes} 处改动未发布` : `${st.unpushed} 个提交未推送`;
	} else {
		el.className = "pill clean";
		el.textContent = "✓ 已和网站同步";
	}
}

// ---------- 列表 ----------
function renderList() {
	const list = $("list");
	if (!state.entries.length) {
		list.innerHTML = `<div class="card empty">还没有日记，在左边写第一条吧 ⚡</div>`;
		return;
	}
	list.innerHTML = state.entries.map((e) => `
		<article class="card entry" data-id="${e.id}">
			<div class="meta">
				<span>🕒 ${fmtDate(e.date)}</span>
				${e.mood ? `<span>💭 ${esc(e.mood)}</span>` : ""}
				${e.location ? `<span>📍 ${esc(e.location)}</span>` : ""}
			</div>
			${e.content ? `<p class="content">${esc(e.content)}</p>` : ""}
			${e.images?.length ? `<div class="imgs">${e.images.map((p) => `<img src="${esc(mediaUrl(p))}" loading="lazy" alt="">`).join("")}</div>` : ""}
			${e.tags?.length ? `<div class="tags">${e.tags.map((t) => `<span># ${esc(t)}</span>`).join("")}</div>` : ""}
			<div class="ops">
				<button class="btn small" data-act="edit">修改</button>
				<button class="btn small danger" data-act="delete">删除</button>
			</div>
		</article>`).join("");
	renderTagSuggest();
}

function renderTagSuggest() {
	const all = [...new Set(state.entries.flatMap((e) => e.tags || []))].slice(0, 12);
	const current = parseTags($("tags").value);
	$("tag-suggest").innerHTML = all
		.map((t) => `<span class="chip${current.includes(t) ? " on" : ""}" data-tag="${esc(t)}">${esc(t)}</span>`)
		.join("");
}

function renderMoods() {
	const cur = $("mood").value.trim();
	$("moods").innerHTML = MOODS.map((m) => `<span class="chip${m === cur ? " on" : ""}" data-mood="${m}">${m}</span>`).join("");
}

// ---------- 图片 ----------
function renderThumbs() {
	const kept = state.keptImages.map((p, i) => `<div class="thumb"><img src="${esc(mediaUrl(p))}" alt=""><button data-kept="${i}" title="移除">×</button></div>`);
	const added = state.newImages.map((img, i) => `<div class="thumb"><img src="${img.dataUrl}" alt=""><button data-new="${i}" title="移除">×</button></div>`);
	$("thumbs").innerHTML = kept.concat(added).join("");
}

function addFiles(files) {
	const images = [...files].filter((f) => f.type.startsWith("image/"));
	if (!images.length) return;
	let pending = images.length;
	for (const f of images) {
		const reader = new FileReader();
		reader.onload = () => {
			state.newImages.push({ dataUrl: reader.result });
			if (--pending === 0) { renderThumbs(); saveDraft(); }
		};
		reader.onerror = () => toast(`读取 ${f.name} 失败`, true);
		reader.readAsDataURL(f);
	}
}

// ---------- 草稿（只保存文字，存在本机浏览器） ----------
function saveDraft() {
	if (state.editingId) return;
	try {
		localStorage.setItem(DRAFT_KEY, JSON.stringify({
			content: $("content").value, mood: $("mood").value, location: $("location").value, tags: $("tags").value,
		}));
	} catch {}
}
function loadDraft() {
	try {
		const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
		if (!d) return;
		$("content").value = d.content || "";
		$("mood").value = d.mood || "";
		$("location").value = d.location || "";
		$("tags").value = d.tags || "";
	} catch {}
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch {} }

// ---------- 表单 ----------
function resetForm() {
	state.editingId = null;
	state.keptImages = [];
	state.newImages = [];
	$("content").value = "";
	$("mood").value = "";
	$("location").value = "";
	$("tags").value = "";
	$("date").value = toLocalInput(new Date());
	$("compose").classList.remove("editing");
	$("compose-title").textContent = "写日记";
	$("save").textContent = "保存";
	updateCount();
	renderThumbs();
	renderMoods();
	renderTagSuggest();
}

function startEdit(id) {
	const e = state.entries.find((x) => x.id === id);
	if (!e) return;
	state.editingId = id;
	state.keptImages = [...(e.images || [])];
	state.newImages = [];
	$("content").value = e.content || "";
	$("mood").value = e.mood || "";
	$("location").value = e.location || "";
	$("tags").value = (e.tags || []).join(" ");
	$("date").value = toLocalInput(new Date(e.date));
	$("compose").classList.add("editing");
	$("compose-title").textContent = "修改日记";
	$("save").textContent = "保存修改";
	updateCount();
	renderThumbs();
	renderMoods();
	renderTagSuggest();
	window.scrollTo({ top: 0, behavior: "smooth" });
	$("content").focus();
}

function updateCount() { $("count").textContent = $("content").value.trim().length; }

async function save() {
	if (state.busy) return;
	const content = $("content").value.trim();
	if (!content && !state.keptImages.length && !state.newImages.length) {
		toast("写点什么或者加张图片吧", true);
		return;
	}
	state.busy = true;
	$("save").disabled = true;
	$("save").innerHTML = `<span class="spinner"></span>保存中`;
	try {
		const data = await api("POST", "/api/diary", {
			id: state.editingId || undefined,
			content,
			date: toIsoWithOffset($("date").value),
			mood: $("mood").value,
			location: $("location").value,
			tags: parseTags($("tags").value),
			images: state.keptImages,
			newImages: state.newImages.map((i) => i.dataUrl),
		});
		const wasEditing = !!state.editingId;
		state.entries = data.entries;
		renderStatus(data.status);
		clearDraft();
		resetForm();
		renderList();
		toast(wasEditing ? "已保存修改 ✓ 记得点「发布到网站」" : "已保存 ✓ 记得点「发布到网站」");
	} catch (e) {
		toast(e.message, true);
	} finally {
		state.busy = false;
		$("save").disabled = false;
		$("save").textContent = state.editingId ? "保存修改" : "保存";
	}
}

async function removeEntry(id) {
	const e = state.entries.find((x) => x.id === id);
	const preview = (e?.content || "").slice(0, 20);
	if (!confirm(`确定删除这条日记吗？\n\n「${preview}${preview.length >= 20 ? "…" : ""}」\n\n发布之后网站上也会删掉。`)) return;
	try {
		const data = await api("DELETE", `/api/diary/${id}`);
		state.entries = data.entries;
		renderStatus(data.status);
		if (state.editingId === id) resetForm();
		renderList();
		toast("已删除");
	} catch (err) {
		toast(err.message, true);
	}
}

async function publish() {
	if (state.busy) return;
	if (!confirm("把日记发布到网站上吗？\n\n会提交改动并推送到 GitHub，几分钟后网站自动更新。")) return;
	state.busy = true;
	const btn = $("publish");
	btn.disabled = true;
	btn.innerHTML = `<span class="spinner"></span>发布中`;
	$("publish-title").textContent = "发布中…";
	$("publish-log").textContent = "正在提交并推送到 GitHub……";
	$("publish-tip").textContent = "";
	$("publish-dialog").showModal();
	try {
		const data = await api("POST", "/api/publish");
		renderStatus(data.status);
		$("publish-title").textContent = "✓ 发布成功";
		$("publish-log").textContent = data.log;
		$("publish-tip").innerHTML = `GitHub 正在重新构建网站，大约 1–3 分钟后生效。<a href="https://github.com/czspig/czspig.github.io/actions" target="_blank" rel="noopener">查看部署进度</a>`;
	} catch (e) {
		$("publish-title").textContent = "✗ 发布失败";
		$("publish-log").textContent = e.message;
		$("publish-tip").textContent = "日记已经保存在本地，不会丢。如果是网络问题，打开代理软件后再点一次「发布到网站」。";
	} finally {
		state.busy = false;
		btn.disabled = false;
		btn.textContent = "发布到网站";
	}
}

// ---------- 事件 ----------
$("content").addEventListener("input", () => { updateCount(); saveDraft(); });
for (const id of ["mood", "location"]) $(id).addEventListener("input", () => { saveDraft(); renderMoods(); });
$("tags").addEventListener("input", () => { saveDraft(); renderTagSuggest(); });
$("save").addEventListener("click", save);
$("clear").addEventListener("click", () => {
	if (($("content").value || state.newImages.length) && !confirm("清空正在写的内容吗？")) return;
	clearDraft();
	resetForm();
});
$("cancel-edit").addEventListener("click", resetForm);
$("publish").addEventListener("click", publish);
$("close-dialog").addEventListener("click", () => $("publish-dialog").close());

document.addEventListener("keydown", (e) => {
	if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); save(); }
});

$("moods").addEventListener("click", (e) => {
	const m = e.target.dataset?.mood;
	if (!m) return;
	$("mood").value = $("mood").value === m ? "" : m;
	renderMoods();
	saveDraft();
});
$("tag-suggest").addEventListener("click", (e) => {
	const t = e.target.dataset?.tag;
	if (!t) return;
	const tags = parseTags($("tags").value);
	const next = tags.includes(t) ? tags.filter((x) => x !== t) : [...tags, t];
	$("tags").value = next.join(" ");
	renderTagSuggest();
	saveDraft();
});

$("list").addEventListener("click", (e) => {
	const act = e.target.dataset?.act;
	if (!act) return;
	const id = Number(e.target.closest(".entry").dataset.id);
	if (act === "edit") startEdit(id);
	if (act === "delete") removeEntry(id);
});

$("thumbs").addEventListener("click", (e) => {
	const { kept, new: added } = e.target.dataset || {};
	if (kept !== undefined) state.keptImages.splice(Number(kept), 1);
	else if (added !== undefined) state.newImages.splice(Number(added), 1);
	else return;
	renderThumbs();
});

const drop = $("drop");
drop.addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); });
document.addEventListener("paste", (e) => {
	const files = [...(e.clipboardData?.items || [])].filter((i) => i.kind === "file").map((i) => i.getAsFile()).filter(Boolean);
	if (files.length) { e.preventDefault(); addFiles(files); }
});

window.addEventListener("beforeunload", (e) => {
	if (state.newImages.length) { e.preventDefault(); e.returnValue = ""; }
});

// ---------- 启动 ----------
(async () => {
	resetForm();
	loadDraft();
	updateCount();
	renderMoods();
	try {
		const data = await api("GET", "/api/diary");
		state.entries = data.entries;
		renderStatus(data.status);
		renderList();
	} catch (e) {
		toast(e.message, true);
		$("status").textContent = "读取失败";
	}
})();
</script>
</body>
</html>
