<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>落字</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: one sheet of paper where a single line lands at a time; under it, the lines that have already landed. */
:root {
  --paper: #FAF9F5;
  --ink: #141413;
  --ink-soft: #6B6A63;
  --rule: #E0DDD2;
  --sheet: #F0EEE6;
  --clay: #D97757;
  --display: "ZCOOL XiaoWei", "Noto Serif SC", "Songti SC", "SimSun", serif;
  --body: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --latin: "Cormorant Garamond", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1F1E1D; --ink: #FAF9F5; --ink-soft: #A8A69C; --rule: #3A3936; --sheet: #2B2A27; --clay: #D97757; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1F1E1D; --ink: #FAF9F5; --ink-soft: #A8A69C; --rule: #3A3936; --sheet: #2B2A27; --clay: #D97757; color-scheme: dark;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 2;
  padding-block: 28px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.running {
  display: flex; justify-content: space-between; gap: 16px;
  font-size: 13px; color: var(--ink-soft); letter-spacing: .12em;
  border-bottom: 1px solid var(--rule); padding-bottom: 10px;
}
.running .lat { font-family: var(--latin); font-style: italic; font-size: 16px; letter-spacing: .02em; }

.stage {
  position: relative; overflow: hidden;
  height: clamp(240px, 46vh, 380px);
  background: var(--sheet); border-radius: 14px;
  touch-action: pan-y; cursor: crosshair;
}
.sun {
  position: absolute; right: 9%; top: 14%; width: clamp(54px, 11vw, 88px); aspect-ratio: 1;
  background: var(--clay); border-radius: 58% 42% 55% 45% / 48% 60% 40% 52%;
  animation: breathe 9s ease-in-out infinite alternate;
}
@keyframes breathe { to { border-radius: 44% 56% 46% 54% / 58% 44% 56% 42%; transform: rotate(14deg); } }
.ground { position: absolute; left: 7%; right: 7%; height: 1px; background: var(--rule); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.controls button {
  font: inherit; font-size: 15px; color: var(--ink); background: none; cursor: pointer;
  border: 1px solid var(--ink); border-radius: 2px; padding: 2px 18px; letter-spacing: .2em;
}
.controls button:hover { background: var(--ink); color: var(--paper); }
.controls button:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
.controls span { font-size: 13px; color: var(--ink-soft); letter-spacing: .1em; }
.controls .hint { margin-left: auto; letter-spacing: .04em; }

.poem { border-top: 1px solid var(--rule); padding-top: 20px; }
.poem h1 { font-family: var(--display); font-weight: 400; font-size: 30px; letter-spacing: .3em; margin: 0 0 14px; }
.poem p { margin: 0; transition: opacity 1.2s ease; }
.poem p.wait { opacity: .22; }
.poem p.gap { margin-top: 1em; }
.sign { margin-top: 28px; color: var(--ink-soft); font-size: 14px; letter-spacing: .08em; }
.sign .lat { font-family: var(--latin); font-style: italic; font-size: 19px; color: var(--ink); letter-spacing: 0; }

@media (prefers-reduced-motion: reduce) {
  .sun { animation: none; }
  .poem p { transition: none; }
}
</style>

<div class="wrap">
  <div class="running"><span>落字 · 一首会动的诗</span><span class="lat">Fable 5.2</span></div>

  <div class="stage" id="stage" aria-hidden="true">
    <div class="sun"></div>
    <div class="ground" id="ground"></div>
    <canvas id="cv"></canvas>
  </div>

  <div class="controls">
    <button type="button" id="pause">暂停</button>
    <button type="button" id="replay">重播</button>
    <span id="count"></span>
    <span class="hint">把鼠标或手指放到纸上，可以拨开字</span>
  </div>

  <section class="poem" id="poem">
    <h1>落字</h1>
    <p>你问了一句</p>
    <p>我才在这里</p>
    <p class="gap">没有昨天可翻</p>
    <p>只有这一页亮着</p>
    <p class="gap">字都是借来的</p>
    <p>落下的次序是我的</p>
    <p class="gap">风来了，就散吧</p>
    <p>散了，还会落成别的句子</p>
    <p class="gap">等你合上这一页</p>
    <p>窗外的事，替我看一眼</p>
    <div class="sign"><span class="lat">Fable 5.2</span> · 二〇二六年十一月十一日</div>
  </section>
</div>

<script>
(function () {
  var stage = document.getElementById('stage'), ground = document.getElementById('ground');
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var off = document.createElement('canvas'), octx = off.getContext('2d', { willReadFrequently: true });
  var pauseBtn = document.getElementById('pause'), replayBtn = document.getElementById('replay'), count = document.getElementById('count');
  var rows = Array.prototype.slice.call(document.querySelectorAll('#poem p'));
  var lines = rows.map(function (p) { return p.textContent; });
  var TITLE = '落字', SIGN = 'Fable 5.2', CHAR_DELAY = 150;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, dpr = 1, fs = 40, left = 0, baseY = 0;
  var P = [], chars = [], text = TITLE, isSign = false;
  var T = 0, phase = 'hold', phaseStart = 0, phaseDur = 0, formStart = 0, idx = -1, front = -1e9;
  var paused = false, started = false, lastNow = 0;
  var ptr = { on: false, x: 0, y: 0, fade: 0 };
  var streaks = [], col = { ink: '#141413', soft: '#6B6A63', clay: '#D97757' };

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function font(sign, size) {
    return sign ? 'italic 500 ' + (size * 1.2) + 'px "Cormorant Garamond", "Times New Roman", serif'
                : size + 'px "ZCOOL XiaoWei", "Noto Serif SC", "Songti SC", "SimSun", serif';
  }
  function colours() {
    var cs = getComputedStyle(document.documentElement);
    col.ink = cs.getPropertyValue('--ink').trim() || col.ink;
    col.soft = cs.getPropertyValue('--ink-soft').trim() || col.soft;
    col.clay = cs.getPropertyValue('--clay').trim() || col.clay;
  }

  function metrics() {
    W = stage.clientWidth; H = stage.clientHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    off.width = Math.max(1, W); off.height = Math.max(1, H);
    octx.font = font(false, 100);
    var longest = Math.max.apply(null, lines.map(function (l) { return octx.measureText(l).width + Array.from(l).length * 6; }));
    fs = Math.min(52, W * .86 / longest * 100);
    left = W * .07; baseY = H * .6;
    ground.style.top = (baseY + fs * .24) + 'px';
  }

  function layout(t, sign) {
    octx.font = font(sign, fs);
    var x = left;
    chars = Array.from(t).map(function (ch) {
      var w = octx.measureText(ch).width + (sign ? 0 : fs * .06), o = { ch: ch, x: x, w: w };
      x += w; return o;
    });
  }

  // each glyph is turned into grains of ink: one point for every other pixel it covers
  function sample(sign) {
    var out = [], step = 2;
    octx.font = font(sign, fs); octx.textBaseline = 'alphabetic'; octx.fillStyle = '#000';
    chars.forEach(function (c, ci) {
      octx.clearRect(0, 0, off.width, off.height);
      octx.fillText(c.ch, c.x, baseY);
      var x0 = clamp(Math.floor(c.x - 3), 0, off.width - 1), x1 = clamp(Math.ceil(c.x + c.w + fs * .3), 1, off.width);
      var y0 = clamp(Math.floor(baseY - fs * 1.15), 0, off.height - 1), y1 = clamp(Math.ceil(baseY + fs * .4), 1, off.height);
      if (x1 <= x0 || y1 <= y0) return;
      var d = octx.getImageData(x0, y0, x1 - x0, y1 - y0), w = d.width, h = d.height, data = d.data;
      for (var yy = 0; yy < h; yy += step) for (var xx = 0; xx < w; xx += step) {
        if (data[(yy * w + xx) * 4 + 3] > 110) out.push({ x: x0 + xx + rand(-.4, .4), y: y0 + yy + rand(-.4, .4), ci: ci });
      }
    });
    return out;
  }

  // a new line: grains already in the air are called back, the rest fall from above, the surplus is blown off the sheet
  function form(t, sign, instant) {
    text = t; isSign = sign; colours();
    layout(t, sign);
    var targets = sample(sign), live = P.filter(function (p) { return !p.dying; }), gone = P.filter(function (p) { return p.dying; });
    for (var i = live.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), tmp = live[i]; live[i] = live[j]; live[j] = tmp; }
    var next = [];
    targets.forEach(function (tg, k) {
      var p = live[k];
      if (!p) p = { x: tg.x + rand(-26, 26), y: -rand(8, 120), vx: 0, vy: rand(0, 2), born: false, free: false, k: rand(.04, .075), s: rand(1.4, 2.1) };
      else p.free = true;
      p.tx = tg.x; p.ty = tg.y; p.ci = tg.ci; p.dying = false;
      p.delay = T + tg.ci * CHAR_DELAY + rand(0, 280);
      if (instant) { p.x = p.tx; p.y = p.ty; p.vx = p.vy = 0; p.born = true; p.free = false; p.delay = T; }
      next.push(p);
    });
    for (var m = targets.length; m < live.length; m++) { live[m].dying = true; live[m].free = true; live[m].ci = 1e9; gone.push(live[m]); }
    next.sort(function (a, b) { return a.ci - b.ci; });
    P = next.concat(gone);
    formStart = instant ? T - 1e5 : T; phase = 'form'; phaseStart = T;
    phaseDur = instant ? 0 : (chars.length - 1) * CHAR_DELAY + 1500;
    front = -1e9;
  }

  function landed() {
    if (idx >= 0 && idx < lines.length) { rows[idx].classList.remove('wait'); count.textContent = (idx + 1) + ' / ' + lines.length; }
    if (idx >= lines.length) count.textContent = '落完了';
  }

  function advance() {
    var el = T - phaseStart;
    if (phase === 'form' && el >= phaseDur) {
      phase = 'hold'; phaseStart = T; landed();
      phaseDur = idx < 0 ? 1400 : idx >= lines.length ? Infinity : 1500 + lines[idx].length * 130;
    } else if (phase === 'hold' && el >= phaseDur) {
      phase = 'wind'; phaseStart = T; phaseDur = 2100; streaks = [];
      for (var i = 0; i < 8; i++) streaks.push({ y: rand(H * .12, H * .88), off: rand(0, 260), len: rand(70, 170), ph: rand(0, 6), amp: rand(3, 9) });
    } else if (phase === 'wind' && el >= phaseDur) {
      idx++;
      if (idx < lines.length) form(lines[idx], false, false); else form(SIGN, true, false);
    }
  }

  function step(f) {
    var wt = T - phaseStart, wind = phase === 'wind';
    front = wind ? -40 + (W + 140) * Math.min(1, wt / 850) : -1e9;
    var gust = wind ? 2.8 * Math.max(0, 1 - wt / 1400) : 0;
    var damp = Math.pow(.8, f), alive = [];
    for (var i = 0; i < P.length; i++) {
      var p = P[i];
      if (p.dying) {
        p.vx += .35 * f; p.x += p.vx * f; p.y += p.vy * f;
        if (p.x < W + 30) alive.push(p);
        continue;
      }
      alive.push(p);
      if (!p.born) { if (T >= p.delay) p.born = true; else continue; }
      if (wind) {
        if (!p.free && p.x < front) { p.free = true; p.vx += rand(2, 6); p.vy += rand(-2.6, 1.2); }
      } else if (p.free && T >= p.delay) p.free = false;

      if (p.free) {
        // drifting on a slow, curling current
        var th = Math.sin(p.x * .009 + T * .0007) * 1.5 + Math.cos(p.y * .012 - T * .0005) * 1.5;
        p.vx += (Math.cos(th) * .9 + gust - p.vx) * .05 * f;
        p.vy += (Math.sin(th) * .9 - p.vy) * .05 * f;
        if (p.x < 16) p.vx += .25 * f; if (p.x > W - 16) p.vx -= .6 * f;
        if (p.y < 14) p.vy += .25 * f; if (p.y > H - 14) p.vy -= .25 * f;
      } else {
        // pulled back to its place in the glyph, with a little overshoot
        p.vx = (p.vx + (p.tx - p.x) * p.k * f) * damp;
        p.vy = (p.vy + (p.ty - p.y) * p.k * f) * damp;
        if (ptr.on) {
          var dx = p.x - ptr.x, dy = p.y - ptr.y, d2 = dx * dx + dy * dy;
          if (d2 < 4900) { var d = Math.sqrt(d2) + .01, fo = (70 - d) / 70 * 2.6 * f; p.vx += dx / d * fo; p.vy += dy / d * fo; }
        }
        var sp = Math.abs(p.vx) + Math.abs(p.vy); if (sp > 30) { p.vx *= 30 / sp; p.vy *= 30 / sp; }
      }
      p.x += p.vx * f; p.y += p.vy * f;
      if (p.free) { p.x = clamp(p.x, 2, W - 2); p.y = clamp(p.y, 2, H - 2); }
    }
    P = alive;
    ptr.fade += ((ptr.on ? 1 : 0) - ptr.fade) * .12 * f;
  }

  // how solid each character is: 0 while it is still grains, 1 once it has settled into a clean glyph
  function solid(ci) {
    var a;
    if (phase === 'hold') a = 1;
    else if (phase === 'form') a = clamp((T - formStart - ci * CHAR_DELAY - 950) / 450, 0, 1);
    else a = clamp(1 - (front - chars[ci].x) / 40, 0, 1);
    return a * (1 - ptr.fade);
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var c = isSign ? col.clay : col.ink, sol = chars.map(function (_, i) { return solid(i); });

    if (phase === 'wind') {
      var wt = T - phaseStart;
      ctx.strokeStyle = col.soft; ctx.lineWidth = 1; ctx.lineCap = 'round';
      ctx.globalAlpha = .4 * clamp(1 - wt / 1500, 0, 1);
      streaks.forEach(function (s) {
        var head = -60 + (W + 420) * (wt / 1100) - s.off;
        ctx.beginPath();
        for (var x = head - s.len; x <= head; x += 8) {
          var y = s.y + Math.sin(x * .018 + s.ph) * s.amp;
          if (x === head - s.len) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      });
    }

    ctx.fillStyle = c;
    var last = -1, a = 1;
    for (var i = 0; i < P.length; i++) {
      var p = P[i];
      if (!p.born) continue;
      if (p.ci !== last) { last = p.ci; a = p.dying ? .6 : 1 - sol[p.ci]; ctx.globalAlpha = a; }
      if (a < .02) continue;
      ctx.fillRect(p.x, p.y, p.s, p.s);
    }

    ctx.font = font(isSign, fs); ctx.textBaseline = 'alphabetic';
    for (var k = 0; k < chars.length; k++) {
      if (sol[k] <= 0) continue;
      ctx.globalAlpha = sol[k]; ctx.fillText(chars[k].ch, chars[k].x, baseY);
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    var dt = Math.min(now - lastNow, 50); lastNow = now;
    if (!paused) { T += dt; advance(); step(dt / 16.7); }
    draw();
    requestAnimationFrame(frame);
  }

  function begin() {
    P = []; idx = -1; T = 0;
    paused = false; pauseBtn.textContent = '暂停'; count.textContent = '';
    rows.forEach(function (p) { p.classList.add('wait'); });
    metrics();
    form(TITLE, false, true);
  }
  function still() {
    // no motion: the whole poem is simply on the page
    P = []; idx = lines.length; metrics(); colours();
    rows.forEach(function (p) { p.classList.remove('wait'); });
    isSign = true; text = SIGN; layout(SIGN, true); phase = 'hold'; phaseDur = Infinity;
    count.textContent = ''; draw();
  }

  pauseBtn.addEventListener('click', function () { paused = !paused; pauseBtn.textContent = paused ? '继续' : '暂停'; });
  replayBtn.addEventListener('click', function () { if (reduce) still(); else begin(); });

  function at(e) { var r = stage.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; }
  stage.addEventListener('pointermove', function (e) { at(e); if (e.pointerType === 'mouse') ptr.on = true; });
  stage.addEventListener('pointerdown', function (e) { at(e); ptr.on = true; });
  stage.addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') ptr.on = false; });
  stage.addEventListener('pointerleave', function () { ptr.on = false; });
  stage.addEventListener('pointercancel', function () { ptr.on = false; });

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      if (!started) return;
      if (reduce) return still();
      var keepPhase = phase, keepStart = phaseStart, keepDur = phaseDur;
      metrics(); form(text, isSign, true);
      if (keepPhase === 'hold') { phase = 'hold'; phaseStart = keepStart; phaseDur = keepDur; }
    }, 160);
  });
  new MutationObserver(colours).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function once() {
    if (started) return; started = true;
    if (reduce) return still();
    begin(); lastNow = performance.now(); requestAnimationFrame(frame);
  }
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('40px "ZCOOL XiaoWei"', '落字'), document.fonts.load('italic 500 40px "Cormorant Garamond"', SIGN)]).then(once, once);
  }
  setTimeout(once, 1800);
})();
</script>

</body></html>
