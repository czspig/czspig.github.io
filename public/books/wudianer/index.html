        c.strokeStyle = K.cream; c.lineWidth = 3; c.lineCap = 'round';
        c.strokeStyle = K.clay; c.beginPath(); c.moveTo(44, 524); c.bezierCurveTo(200, 590, 420, 520, 566, 552); c.stroke();
        c.fillStyle = K.umber; c.beginPath(); c.moveTo(560, 552); c.quadraticCurveTo(628, 528, 696, 552); c.quadraticCurveTo(628, 576, 560, 552); c.fill();
        c.strokeStyle = K.umber; c.lineWidth = 2.5; c.stroke();
        line(c, 596, 552, 660, 552, K.cream, 4);
      }
    ];
  }

  /* 其五 湖 */
  function lake() {
    function hill(x) { return 300 + 40 * Math.sin(x * .005 + 1) + 15 * Math.sin(x * .02); }
    function rx(t) { return 700 + 130 * Math.sin(t * 5.2 + .6) * (1 - t * .6); }
    function inLake(x, y) { var a = (x - 360) / 300, b = (y - 455) / 62; return a * a + b * b < 1; }
    return [
      { n: 3300, w: THICK, len: LEN, at: function () { var x = rnd(-10, 1010); return [x, rnd(-10, hill(x) + 10)]; },
        ang: function (x, y) { return Math.sin(x * .006 + y * .01) * .3; },
        col: function () { var q = Math.random(); return q < .1 ? K.peach : q < .22 ? '#C9D8E6' : pk([K.cream, K.white, K.sand, K.cream]); } },
      { n: 1150, w: THICK, len: LEN, at: function () { var x = rnd(-10, 1010); return [x, rnd(hill(x) - 4, 406)]; },
        ang: function (x) { return Math.atan2(hill(x + 6) - hill(x), 6) + rnd(-.25, .25); },
        col: function () { return pk([K.olive2, K.olive3, K.blue3, K.blue2, K.olive, K.olive2]); } },
      { n: 5200, w: THICK, len: LEN, at: function () { var x = rnd(-10, 1010), y = rnd(398, 760); return inLake(x, y) ? null : [x, y]; },
        ang: function (x, y) { return Math.sin(x * .01 + y * .02) * .35; },
        col: function (x, y) { return y > 640 && Math.random() < .3 ? pk([K.olive2, K.olive3]) : pk([K.olive, K.olive, K.olive2, K.sage, K.sage, K.umber, K.peach]); } },
      { n: 1800, w: THICK, len: LEN, at: function () { var a = rnd(0, 6.2832), r = Math.sqrt(Math.random()); return [360 + Math.cos(a) * 300 * r, 455 + Math.sin(a) * 62 * r]; },
        ang: function () { return rnd(-.1, .1); },
        col: function () { return Math.random() < .13 ? pk([K.cream, K.white]) : pk([K.blue, K.blue, K.blue2, K.pale, K.blue2]); } },
      { n: 760, w: THICK, len: [3, 6], at: function () { var t = rnd(0, 1), wd = 46 * (1 - t) + 6; return [rx(t) + rnd(-wd, wd) / 2, 760 - 330 * t]; },
        ang: function (x, y) { var t = (760 - y) / 330; return Math.atan2(-3.3, rx(t + .01) - rx(t)) + rnd(-.2, .2); },
        col: function () { return pk([K.clay, K.clay, K.peach, K.cream, K.deep]); } },
      function (c) {
        // the relay station
        c.fillStyle = K.cream; c.fillRect(772, 548, 74, 46);
        c.fillStyle = K.deep; c.beginPath(); c.moveTo(764, 550); c.lineTo(800, 520); c.lineTo(854, 550); c.closePath(); c.fill();
        c.fillStyle = K.ink; c.fillRect(800, 566, 14, 28);
        c.strokeStyle = K.umber; c.lineWidth = 2.5; c.strokeRect(772, 548, 74, 46);
        // the old horse, drinking
        c.fillStyle = K.umber; c.beginPath(); c.ellipse(742, 626, 21, 10, 0, 0, 6.2832); c.fill();
        line(c, 759, 622, 771, 642, K.umber, 7);
        line(c, 728, 632, 727, 650, K.umber, 3.5); line(c, 736, 634, 736, 651, K.umber, 3.5);
        line(c, 749, 634, 750, 651, K.umber, 3.5); line(c, 756, 632, 757, 650, K.umber, 3.5);
        disc(c, 771, 652, 9, K.pale);
        // the young one, already far up the road
        var hx = rx(.8), hy = 760 - 330 * .8;
        c.fillStyle = K.ink; c.beginPath(); c.ellipse(hx, hy, 8, 4, 0, 0, 6.2832); c.fill();
        line(c, hx + 6, hy - 2, hx + 10, hy - 8, K.ink, 3);
        line(c, hx - 4, hy + 2, hx - 5, hy + 9, K.ink, 1.8); line(c, hx + 4, hy + 2, hx + 5, hy + 9, K.ink, 1.8);
      }
    ];
  }

  /* 小稿 */
  function light() {
    return [{ n: 1500, thin: true, w: [1.1, 2.2], len: [4, 10], at: function () { var r = rnd(8, 200), a = rnd(0, 6.2832); return Math.random() < r / 235 ? null : [300 + Math.cos(a) * r, 225 + Math.sin(a) * r]; },
      ang: function (x, y) { return around(x, y, 300, 225); },
      col: function (x, y) { var d = hyp(x - 300, y - 225); return d < 46 ? K.clay : d < 110 ? pk([K.clay, K.clay, K.deep]) : pk([K.deep, K.umber, K.coal[3]]); } }];
  }
  function current() {
    var p = [rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28)];
    return [{ n: 1200, thin: true, w: [1, 1.9], len: [8, 18], at: function () { return [rnd(10, 590), rnd(10, 440)]; },
      ang: function (x, y) { return Math.sin(x * .009 + p[0]) * 1.3 + Math.cos(y * .012 + p[1]) * 1.3 + Math.sin((x + y) * .006 + p[2]) * .8; },
      col: function () { return Math.random() < .07 ? K.clay : pk([K.ink, K.coal[3], K.coal[1]]); } }];
  }

  var MAKE = { lamp: lamp, ferry: ferry, echo: echo, weave: weave, lake: lake, light: light, current: current };
  var BG = { lake: '#E9E2D2', light: '#F0EEE6', current: '#F0EEE6' };
  var works = Array.prototype.slice.call(document.querySelectorAll('canvas[data-work]')).map(function (cv) {
    var id = cv.getAttribute('data-work'), small = id === 'light' || id === 'current';
    return { id: id, cv: cv, c: cv.getContext('2d'), w: small ? 600 : W, h: small ? 450 : H };
  });
  var run = 0;

  function prepare(wk) {
    wk.cv.width = wk.w * SC; wk.cv.height = wk.h * SC;
    wk.c.setTransform(SC, 0, 0, SC, 0, 0);
    wk.c.fillStyle = BG[wk.id] || '#E9E2D2'; wk.c.fillRect(0, 0, wk.w, wk.h);
    wk.layers = MAKE[wk.id](); wk.li = 0; wk.k = 0;
  }
  // lay up to `budget` strokes on one painting; returns true while there is more to do
  function work(wk, budget) {
    while (budget > 0 && wk.li < wk.layers.length) {
      var L = wk.layers[wk.li];
      if (typeof L === 'function') { wk.c.globalAlpha = 1; L(wk.c); wk.li++; continue; }
      if (wk.k >= L.n) { wk.li++; wk.k = 0; continue; }
      wk.k++;
      var p = L.at(); if (!p) continue;
      stroke(wk.c, L, p[0], p[1]); budget--;
    }
    return wk.li < wk.layers.length;
  }

  function paintAll() {
    var my = ++run, i = 0;
    works.forEach(prepare);
    if (reduce) { works.forEach(function (wk) { while (work(wk, 5000)) {} }); return; }
    (function tick() {
      if (my !== run) return;
      while (i < works.length && !work(works[i], 190)) i++;
      if (i < works.length) requestAnimationFrame(tick);
    })();
  }

  document.getElementById('again').addEventListener('click', paintAll);
  paintAll();

  // embedded in the blog: grow the iframe to fit the gallery
  var frame = null; try { frame = window.frameElement; } catch (e) {}
  function fit() { if (frame) frame.style.height = Math.ceil(document.body.getBoundingClientRect().height) + "px"; }
  fit(); window.addEventListener('resize', fit); window.addEventListener('load', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
